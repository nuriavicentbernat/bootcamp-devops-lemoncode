apiVersion: v1
kind: Pod
metadata:
  labels:
    run: web-1
  name: web-1
spec:
  containers:
  - image: lemoncodersbc/hello-world-web:v1
    name: web-1
    ports:
    - containerPort: 3000
      protocol: TCP
  dnsPolicy: ClusterFirst
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    run: web-1
  name: web-1-svc
spec:
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    run: web-1
  type: ClusterIP
